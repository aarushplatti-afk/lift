<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B0F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lift" />
    <link rel="icon" href="/lift/icons/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/lift/icons/source.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/lift/icons/apple-touch-icon-180x180.png" />
    <script>
      try {
        var t = localStorage.getItem('lift.theme');
        var dark =
          t === 'light'
            ? false
            : t === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
              : true;
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    </script>
    <title>Lift</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
